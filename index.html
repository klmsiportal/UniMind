<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniMind - AI Study Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #f8fafc; /* Slate 50 */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Animations */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.4s ease-out forwards;
      }
      
      .thinking-pulse {
        animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }

      /* Premium Gradients */
      .gold-gradient {
        background: linear-gradient(135deg, #FFD700 0%, #FDB931 50%, #C08215 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gold-bg {
        background: linear-gradient(135deg, #FFD700 0%, #FDB931 50%, #C08215 100%);
      }
      
      /* Markdown-like Styles within Chat */
      .prose-content code {
        background-color: #1e293b;
        padding: 0.2em 0.4em;
        border-radius: 0.3em;
        font-family: monospace;
        font-size: 0.9em;
        color: #e2e8f0;
      }
      .prose-content pre {
        background-color: #1e293b;
        padding: 1em;
        border-radius: 0.5em;
        overflow-x: auto;
        margin-top: 0.5em;
        margin-bottom: 0.5em;
        border: 1px solid #334155;
      }
      .prose-content pre code {
        background-color: transparent;
        padding: 0;
        color: #a5b4fc;
      }
      .prose-content strong {
        color: #fff;
        font-weight: 700;
      }
      .prose-content p {
        margin-bottom: 0.75em;
      }
      .prose-content p:last-child {
        margin-bottom: 0;
      }
      .prose-content ul {
        list-style-type: disc;
        padding-left: 1.5em;
        margin-bottom: 0.75em;
      }
      .prose-content ol {
        list-style-type: decimal;
        padding-left: 1.5em;
        margin-bottom: 0.75em;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",

    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
    "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
